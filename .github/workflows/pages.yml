# Builds the privacy policy / support site (site/) and publishes it with GitHub Pages:
#   https://mjlittlebyte.github.io/sgcarbuddy/            (support)
#   https://mjlittlebyte.github.io/sgcarbuddy/privacy/    (Google Play privacy policy URL)
# Repo settings → Pages → Source: "GitHub Actions" (enabled once).
name: Privacy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'mobile/package.json'
      - 'mobile/src/app/links.ts'
      - 'mobile/public/brand/icon-round.svg'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and check
        run: node site/build.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
